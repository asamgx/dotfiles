"$schema" = 'https://starship.rs/config-schema.json'

palette = 'catppuccin_mocha'
command_timeout = 1000       # Increase timeout to 1000ms (default is 500ms)

format = """
$shell\
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_metrics\
$git_status\
$docker_context\
$c\
$cmake\
$cobol\
$daml\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$fennel\
$gleam\
$golang\
$guix_shell\
$haskell\
$haxe\
$helm\
$java\
$julia\
$kotlin\
$gradle\
$lua\
$nim\
$nodejs\
$bun\
$ocaml\
$opa\
$perl\
$php\
$pulumi\
$purescript\
$python\
$quarto\
$raku\
$rlang\
$red\
$ruby\
$rust\
$scala\
$solidity\
$swift\
$terraform\
$typst\
$vlang\
$vagrant\
$zig\
$buf\
$nix_shell\
$conda\
$meson\
$spack\
$aws\
${custom.gcloud}\
${custom.gcloud_prod}\
$openstack\
$azure\
$direnv\
$env_var\
$mise\
$crystal\
${custom.gh_user}\
$sudo\
$cmd_duration\
$line_break\
$jobs\
$status\
$character"""

# To add back removed modules, uncomment and add to format above:
# $localip - Show local IP address
# $shlvl - Show shell level (nested shells)
# $singularity - Singularity container indicator
# $kubernetes - Kubernetes context
# $vcsh - VCSH repository
# $fossil_branch - Fossil branch
# $fossil_metrics - Fossil metrics
# $git_commit - Git commit hash
# $hg_branch - Mercurial branch
# $pijul_channel - Pijul channel
# $package - Package version from package.json, etc
# $memory_usage - Memory usage
# $nats - NATS context
# $battery - Battery level
# $time - Current time
# $os - Operating system
# $container - Container indicator
# $netns - Network namespace

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[os]
disabled = true

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
# Macos = ""
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = false                  # Only show on SSH (via detect_env_vars)
format = '[$user]($style) '
detect_env_vars = ['SSH_CONNECTION'] # Only show when SSH_CONNECTION is set

[hostname]
ssh_only = true
format = "[ $hostname ]($style)"
trim_at = "-"
disabled = false

[sudo]
symbol = "󰒃 " # shield only
style = "bold peach"
format = '[$symbol]($style)'
disabled = false
allow_windows = false

[shell]
format = "[$indicator]($style)  " # 2 spaces: Ghostty widens the icon into the first
style = "bold yellow"
fish_indicator = '󰈺'
bash_indicator = ''
zsh_indicator = "" # Nerd Font bolt: one cell wide, no emoji fallback
powershell_indicator = '⚡'
# powershell_indicator = '_'
unknown_indicator = ' '
disabled = false

[directory]
read_only = " "
format = "[  $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
# symbol = ""
symbol = " "

[git_status]
conflicted = "󰞇${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "󰋗${count}"
stashed = "󰏗${count}"
modified = "󰷉${count}"
staged = "󰄬${count}"
renamed = "󰑕${count}"
deleted = "󰮘${count}"
format = '([$conflicted](bold yellow)[$deleted](bold red)[$renamed](bold blue)[$modified](bold peach)[$staged](bold green)[$untracked](bold sky)[$stashed](bold lavender)[$ahead_behind](bold lavender) )'

[git_metrics]
added_style = "bold green"
deleted_style = "bold red"
disabled = false
format = '([+$added]($added_style) )([-$deleted]($deleted_style) )'
only_nonzero_diffs = true                                           # Only show if there are changes

[git_commit]
format = '[\($hash$tag\)]($style) '
commit_hash_length = 4
disabled = true                     # Disabled for minimal prompt; set to false to re-enable

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
disabled = false

[env_var.ENV]
format = '[ $env_value ]($style)'

[nodejs]
symbol = ""

[c]
symbol = " "

[rust]
symbol = ""

[golang]
symbol = ""

[php]
symbol = ""

[java]
symbol = " "

[kotlin]
symbol = ""

[haskell]
symbol = ""

[python]
symbol = ""
pyenv_version_name = true
pyenv_prefix = "ℙ"

[bun]
symbol = "🍔"

[dart]
symbol = ""

[docker_context]
# symbol = ""
symbol = "🐋"
disabled = true # Hidden for minimal prompt; set to false to re-enable


[gcloud]
format = '[$symbol $active(\($region\))]($style) '
# format = 'on [$symbol$account(@$domain)(\($region\))]($style) '
symbol = '☁️'
disabled = true # Replaced by custom.gcloud / custom.gcloud_prod below

# Active gcloud config name, like $gcloud, but red when its project contains
# "prod". The built-in module can't change colour per project, so one of these
# two prints the name and the other prints nothing. Matching by pattern keeps
# project names out of this public repo. Keep the two scripts in sync.
[custom.gcloud]
command = '''
d="${CLOUDSDK_CONFIG:-$HOME/.config/gcloud}"
c="${CLOUDSDK_ACTIVE_CONFIG_NAME:-$(cat "$d/active_config" 2>/dev/null)}"
f="$d/configurations/config_${c:-default}"
[ -f "$f" ] || exit 0
case "$(sed -n 's/^project *= *//p' "$f")" in *[Pp][Rr][Oo][Dd]*) ;; *) printf %s "${c:-default}" ;; esac
'''
when = true
shell = ["sh"]
format = '([☁️ $output]($style) )'
style = "bold blue"

[custom.gcloud_prod]
command = '''
d="${CLOUDSDK_CONFIG:-$HOME/.config/gcloud}"
c="${CLOUDSDK_ACTIVE_CONFIG_NAME:-$(cat "$d/active_config" 2>/dev/null)}"
f="$d/configurations/config_${c:-default}"
[ -f "$f" ] || exit 0
case "$(sed -n 's/^project *= *//p' "$f")" in *[Pp][Rr][Oo][Dd]*) printf %s "${c:-default}" ;; esac
'''
when = true
shell = ["sh"]
format = '([☁️ $output]($style) )'
style = "bold red"

[package]
disabled = true

[custom.gh_user]
command = "cat ~/.cache/gh_active_user 2>/dev/null"
require_repo = true
when = true
shell = ["sh"]
symbol = " "
format = "([$symbol$output]($style) )"
style = "bold lavender"

[cmd_duration]
min_time = 2000                 # Only show if command took longer than 2 seconds
format = "[$duration]($style) "
disabled = false

[line_break]
disabled = false

[jobs]
symbol = '⚙'
format = '[$symbol$number]($style) '

[character]
disabled = false
success_symbol = '[✦](bold fg:green)'
error_symbol = '[✦](bold fg:red)'
vimcmd_symbol = '[✦](bold fg:green)'
vimcmd_replace_one_symbol = '[✦](bold fg:mauve)'
vimcmd_replace_symbol = '[✦](bold fg:mauve)'
vimcmd_visual_symbol = '[✦](bold fg:lavender)'
